apply plugin: 'com.android.application'

android {
    namespace 'dev.venturis.clippy'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.venturis.clippy'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'dev.venturis.clippy.ClipboardFlowTest'
    }

    buildFeatures { buildConfig true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
